<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Server Garden V6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: an instrument console. Sticky masthead, a fleet strip of six readings,
   then a dense node matrix beside a pinned inspector; a fleet heatmap and event log close the page.
   原型：独立参考稿，全部为模拟数据，不是生产前端。 */
:root{
  --bg:#EBEFEA; --surface:#F8FAF7; --surface-2:#E2E8E1; --ink:#14201A; --ink-2:#3A473F; --muted:#66736B;
  --line:#D2DAD2; --line-strong:#B5C1B7; --accent:#2D6A4B; --on-accent:#F4FAF5;
  --ok:#4E8A65; --slow:#5784A7; --lightloss:#B48E3B; --loss:#BA6646; --fail:#AE3B3B; --unknown:#BAC1B8;
  --c-ct:#3A72A8; --c-cu:#C0583A; --c-cm:#258F7E; --c-cpu:#2D6A4B; --c-mem:#5867AA; --c-disk:#9474A8;
  --c-rx:#2D6A4B; --c-tx:#B48E3B; --heat-lo:#E2E8E1; --tip-bg:#14201A; --tip-fg:#EEF3EF;
  --f-display:"Bricolage Grotesque","IBM Plex Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:7px; --gut:clamp(16px,2.2vw,32px); --top:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#151C18; --surface-2:#1D2621; --ink:#E2EAE4; --ink-2:#B7C4BB; --muted:#84928A;
  --line:#253029; --line-strong:#35433A; --accent:#86C9A0; --on-accent:#0E1311;
  --ok:#7BBD92; --slow:#82AFD1; --lightloss:#D7B363; --loss:#DF8C6B; --fail:#EA7979; --unknown:#38433C;
  --c-ct:#7CADDC; --c-cu:#E8906F; --c-cm:#69C8B6; --c-cpu:#86C9A0; --c-mem:#9DACE5; --c-disk:#C5A7D8;
  --c-rx:#86C9A0; --c-tx:#D7B363; --heat-lo:#1A231E; --tip-bg:#E2EAE4; --tip-fg:#0E1311; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#151C18; --surface-2:#1D2621; --ink:#E2EAE4; --ink-2:#B7C4BB; --muted:#84928A;
  --line:#253029; --line-strong:#35433A; --accent:#86C9A0; --on-accent:#0E1311;
  --ok:#7BBD92; --slow:#82AFD1; --lightloss:#D7B363; --loss:#DF8C6B; --fail:#EA7979; --unknown:#38433C;
  --c-ct:#7CADDC; --c-cu:#E8906F; --c-cm:#69C8B6; --c-cpu:#86C9A0; --c-mem:#9DACE5; --c-disk:#C5A7D8;
  --c-rx:#86C9A0; --c-tx:#D7B363; --heat-lo:#1A231E; --tip-bg:#E2EAE4; --tip-fg:#0E1311; color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;font-synthesis:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num small,.unit{font-family:var(--f-body);font-size:.78em;color:var(--muted);letter-spacing:0;margin-left:1px}
.label{font-size:11px;color:var(--muted);letter-spacing:.02em}
.caps{font:600 10px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1680px;margin:0 auto;padding-inline:var(--gut)}

/* Masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:var(--top)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--ink)}
.brand b{font:800 17px/1 var(--f-display);letter-spacing:-.04em}
.brand span{font:500 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em;padding-left:9px;border-left:1px solid var(--line-strong)}
.proto{font:600 10px/1 var(--f-mono);letter-spacing:.08em;color:var(--lightloss);border:1px dashed currentColor;border-radius:99px;padding:4px 8px;white-space:nowrap}
.pulse{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.pulse svg{width:18px;height:18px;transform:rotate(-90deg)}
.pulse .track{fill:none;stroke:var(--line-strong);stroke-width:2}
.pulse .ring{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:44;stroke-dashoffset:0;animation:drain 5s linear infinite}
.pulse .core{fill:var(--accent)}
@keyframes drain{to{stroke-dashoffset:44}}
.spacer{flex:1}
.search{position:relative;width:min(280px,30vw)}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 34px 0 32px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:10px;top:10px;width:14px;height:14px;color:var(--muted)}
.search kbd{position:absolute;right:8px;top:8px;font:500 10px/16px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:5px;font:500 12px/1 var(--f-mono);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in oklab,var(--ink) 14%,transparent)}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;background:var(--surface)}
.icon-btn svg{width:16px;height:16px}

/* Masthead line */
.mast{display:flex;align-items:baseline;gap:16px 28px;flex-wrap:wrap;padding-block:22px 16px}
.mast h1{margin:0;font:800 clamp(28px,3.2vw,40px)/1 var(--f-display);letter-spacing:-.045em;text-wrap:balance}
.mast h1 i{font-style:normal;color:var(--accent)}
.mast p{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
.mast .meta{margin-left:auto;display:flex;gap:18px;font-size:11px;color:var(--muted)}
.mast .meta b{color:var(--ink);font-weight:500}

/* Fleet strip */
.band{display:grid;grid-template-columns:1.05fr 1.15fr 1fr 1.35fr 1.2fr 1.25fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.cell{padding:13px 16px 12px;min-width:0;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.cell:first-child{border-left:0}
.cell .big{font:700 30px/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.cell .big small{font:500 13px/1 var(--f-body);color:var(--muted);letter-spacing:0}
.cell .row2{display:flex;align-items:end;justify-content:space-between;gap:10px;min-height:26px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--ok)}
.chips{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink-2);min-width:0}
.chips span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips em{font-style:normal;color:var(--muted)}
.ctr{display:grid;grid-template-columns:28px 1fr 52px;align-items:center;gap:6px;font-size:11px}
.ctr .bar{height:5px;background:var(--surface-2);border-radius:3px;position:relative;overflow:hidden}
.ctr .bar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.ctr .bar:after{content:"";position:absolute;left:60%;top:-2px;bottom:-2px;width:1px;background:var(--line-strong)}
.ctr .num{text-align:right}
.dist{display:flex;height:8px;border-radius:3px;overflow:hidden;gap:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:2px}
svg.spark{display:block;overflow:visible}

/* Main layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0 8px 0 2px;font:700 15px/1 var(--f-display);letter-spacing:-.02em}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{white-space:nowrap;height:26px;padding:0 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.pill b{font:500 11px var(--f-mono);color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill[aria-pressed="true"] b{color:inherit;opacity:.7}
.pill .sw{width:6px;height:6px;border-radius:50%}
.sel{height:26px;border:1px solid var(--line);border-radius:99px;background:var(--surface);padding:0 10px;font-size:12px;color:var(--ink-2)}
.panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* Node matrix */
.mx{--cols:minmax(178px,1.25fr) 186px 132px minmax(232px,2fr) 76px}
.mx-h,.mx-r{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;padding:0 12px}
.mx-h{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:5;background:var(--surface);height:30px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.mx-h .res,.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mx-h .qh{display:grid;grid-template-columns:16px 1fr 46px 40px;gap:6px}
.mx-h .qh span:nth-child(n+3),.q-line .num{text-align:right}
.grp{display:flex;align-items:center;gap:10px;padding:14px 12px 6px;font-size:11px;color:var(--muted)}
.grp b{font:700 12px var(--f-display);color:var(--ink);letter-spacing:.01em}
.grp hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.mx-r{min-height:58px;padding-block:7px;border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent);cursor:pointer;position:relative;transition:background .12s}
.mx-r:hover{background:color-mix(in oklab,var(--surface-2) 55%,transparent)}
.mx-r[aria-selected="true"]{background:var(--surface-2)}
.mx-r[aria-selected="true"] .nm b{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.mx-r.dim>*:not(.nm){opacity:.42}
.nm{display:flex;gap:9px;align-items:center;min-width:0}
.nm>div{min-width:0}
.nm b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .sub{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in oklab,var(--ok) 18%,transparent)}
.st[data-s="attention"],.st[data-s="warning"]{background:var(--lightloss);box-shadow:0 0 0 3px color-mix(in oklab,var(--lightloss) 22%,transparent)}
.st[data-s="offline"]{background:var(--fail);box-shadow:0 0 0 3px color-mix(in oklab,var(--fail) 20%,transparent)}
.st[data-s="stale"]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.tag{font:600 9.5px/1 var(--f-mono);letter-spacing:.06em;padding:3px 5px;border-radius:3px;background:var(--surface-2);color:var(--muted);vertical-align:1px;margin-left:5px}
.tag.warn{color:var(--loss);background:color-mix(in oklab,var(--loss) 13%,transparent)}
.mtr{display:flex;flex-direction:column;gap:4px;min-width:0}
.mtr .num{font-size:13px}
.mtr .bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.mx-r[aria-selected="true"] .mtr .bar{background:var(--bg)}
.mtr .bar i{display:block;height:100%;border-radius:2px;background:var(--c)}
.mtr.hot .num{color:var(--loss);font-weight:600}
.mtr.hot .bar i{background:var(--loss)}
.net{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;font-size:12px}
.net .arr{color:var(--muted);font-size:10px}
.net svg{grid-column:1/-1}
.qcol{display:flex;flex-direction:column;gap:3px;min-width:0}
.q-line{display:grid;grid-template-columns:16px 1fr 46px 40px;gap:6px;align-items:center;font-size:11.5px}
.q-line>span:first-child{font-size:10.5px;color:var(--muted)}
.q-line .ls{color:var(--muted);text-align:right;font-family:var(--f-mono);font-size:10.5px}
.q-line .ls.bad{color:var(--loss)}
.strip{display:flex;gap:1px;height:9px;min-width:0}
.strip i{flex:1;min-width:0;border-radius:1px;background:var(--ok)}
.g-normal{background:var(--ok)!important}.g-slow{background:var(--slow)!important}.g-lightloss{background:var(--lightloss)!important}.g-loss{background:var(--loss)!important}.g-failed{background:var(--fail)!important}
.g-unknown{background:repeating-linear-gradient(135deg,var(--unknown) 0 2px,transparent 2px 4px)!important}
.upt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px}
.upt .label{font-size:10.5px}

/* Card view */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;background:var(--surface);text-align:left}
.card:hover{border-color:var(--line-strong)}
.card[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card .net{grid-template-columns:auto 1fr auto 1fr}

/* Inspector */
.insp{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - var(--top) - 24px);overflow:auto;scrollbar-width:thin}
.ih{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.ih .pod{width:34px;height:34px;flex:none;color:var(--ink)}
.ih h2{margin:0;font:750 21px/1.1 var(--f-display);letter-spacing:-.035em}
.ih p{margin:4px 0 0;font-size:11.5px;color:var(--muted)}
.ih .close{margin-left:auto;display:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;padding:3px 8px 3px 7px;border-radius:99px;background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok);margin-top:8px}
.status[data-s="attention"],.status[data-s="warning"]{background:color-mix(in oklab,var(--lightloss) 16%,transparent);color:var(--lightloss)}
.status[data-s="offline"]{background:color-mix(in oklab,var(--fail) 14%,transparent);color:var(--fail)}
.status[data-s="stale"]{background:var(--surface-2);color:var(--muted)}
.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.kpi{padding:10px 12px 11px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.kpi:first-child{border-left:0}
.kpi .num{font-size:19px;font-weight:500}
.kpi .bar{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--c)}
.sec{padding:13px 16px 14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-h h3{margin:0;font:600 12.5px/1 var(--f-body)}
.sec-h .legend{margin-left:auto}
.readout{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:11px;color:var(--muted);min-height:17px;margin-top:4px}
.readout b{color:var(--ink);font-weight:500;font-family:var(--f-mono)}
.readout .t{color:var(--ink-2);font-family:var(--f-mono)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font:10px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .thr{stroke:var(--lightloss);stroke-width:1;stroke-dasharray:3 3}
.chart .gap{fill:color-mix(in oklab,var(--unknown) 30%,transparent)}
.chart .xh{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 2}
.big-strips{display:grid;grid-template-columns:28px 1fr;gap:5px 8px;align-items:center;font-size:11px;color:var(--muted)}
.big-strips .strip{height:13px;gap:1.5px}
.big-strips .strip i{border-radius:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:12px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere}

/* Bottom row */
.lower{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:16px;margin-top:16px}
.heat{padding:10px 12px 12px}
.hm{display:grid;grid-template-columns:118px minmax(0,1fr);gap:2px 10px;align-items:center}
.hm .nmc{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hm .cells{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:1.5px;height:15px}
.hm .cells i{border-radius:2px;min-width:0}
.hm .axis{display:flex;justify-content:space-between;font:10px var(--f-mono);color:var(--muted);padding-top:4px}
.scale{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.scale span.g{width:90px;height:7px;border-radius:2px}
.events{list-style:none;margin:0;padding:4px 0;max-height:438px;overflow:auto}
.events li{display:grid;grid-template-columns:44px 10px minmax(0,1fr);gap:8px;padding:7px 14px;font-size:12px;align-items:baseline;border-bottom:1px solid color-mix(in oklab,var(--line) 55%,transparent)}
.events li:last-child{border-bottom:0}
.events time{font:11px var(--f-mono);color:var(--muted)}
.events .dot{width:7px;height:7px;border-radius:50%;align-self:center}
.events b{font-weight:600}
.events .why{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 28px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:22px}

.tip{position:fixed;z-index:60;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:11.5px;line-height:1.5;padding:7px 9px;border-radius:5px;max-width:280px;box-shadow:0 6px 18px color-mix(in oklab,var(--ink) 25%,transparent)}
.tip b{font-weight:600}
.flash{animation:flash .9s ease-out}
@keyframes flash{from{color:var(--accent)}}
.scrim{display:none}

@media (max-width:1360px){
  .layout{grid-template-columns:minmax(0,1fr) 380px}
  .mx{--cols:minmax(160px,1.2fr) 168px 120px minmax(210px,2fr)}
  .mx .upt,.mx-h .uh{display:none}
  .band{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cell:nth-child(4){border-left:0}
  .cell:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .insp{position:fixed;inset:auto 0 0 0;top:auto;max-height:86vh;z-index:50;border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px color-mix(in oklab,var(--ink) 25%,transparent)}
  body.sheet .insp{transform:none}
  .ih .close{display:grid}
  .scrim{display:block;position:fixed;inset:0;z-index:45;background:color-mix(in oklab,var(--ink) 40%,transparent);opacity:0;pointer-events:none;transition:opacity .2s}
  body.sheet .scrim{opacity:1;pointer-events:auto}
  .lower{grid-template-columns:minmax(0,1fr)}

const REGIONS=['亚太','北美','欧洲'];

function walk(r,n,base,vol,lo,hi,rev=.18){let v=base+(r()-.5)*vol;const out=[];for(let i=0;i<n;i++){v+=(base-v)*rev+(r()-.5)*vol*2;out.push(clamp(v,lo,hi))}return out}
function genSeries(node,range){
  const {n,step}=RANGES[range],r=rng(hash(node.id+range)),end=Math.floor(Date.now()/1000);
  const t=Array.from({length:n},(_,i)=>end-(n-1-i)*step);

  const mem=walk(r,n,node.mem,1.2,5,99),dsk=walk(r,n,node.dsk,.25,1,99,.4);

  const rx=walk(r,n,node.rx,node.rx*.35,0,1e4).map((v,i)=>v*diurnal(i)),tx=walk(r,n,node.tx,node.tx*.35,0,1e4).map((v,i)=>v*diurnal(i));

      if(slow&&r()<.3)x+=40+r()*60;

  if(node.offline){const from=Math.floor(n*({'1h':.62,'24h':.975,'7d':.996}[range]));for(let i=from;i<n;i++)blank(i)}
  if(node.stale){for(let i=n-(range==='1h'?3:1);i<n;i++)blank(i)}
  const g=GAP[range];if(g)for(let i=g[0];i<=g[1];i++)blank(i);
  return s;
}
const DATA={};for(const k in RANGES){DATA[k]={};for(const nd of NODES)DATA[k][nd.id]=genSeries(nd,k)}

/* ---------- state ---------- */
const state={range:'1h',region:'all',status:'all',q:'',sort:'weight',view:'matrix',sel:'lab-sin',heat:'cpu'};
try{const v=localStorage.getItem('sg6-view');if(v)state.view=v;const t=localStorage.getItem('sg6-theme');if(t)document.documentElement.dataset.theme=t}catch{}

const last=a=>{for(let i=a.length-1;i>=0;i--)if(a[i]!=null)return a[i];return null};
const lastFresh=a=>a[a.length-1];
const grade=(lat,loss)=>lat==null||loss==null?'unknown':loss>=100?'failed':lat>=1000||loss>=5?'loss':loss>0?'lightloss':lat>=300?'slow':'normal';
const RANK={normal:0,slow:1,lightloss:2,loss:3,failed:4,unknown:5};
const GLABEL={normal:'正常',slow:'高延迟',lightloss:'轻微失败',loss:'需留意',failed:'探测失败',unknown:'无有效数据'};
const SLABEL={online:'正常',attention:'线路需留意',warning:'资源偏高',stale:'数据过期',offline:'已离线'};

function current(nd){
  const s=DATA['1h'][nd.id];
  const fresh=!nd.offline&&!nd.stale;
  const v=k=>fresh?lastFresh(s[k]):null;
  const q=CARRIERS.map(c=>{const lat=fresh?lastFresh(s.lat[c.k]):null,loss=fresh?lastFresh(s.loss[c.k]):null;return {lat,loss,g:grade(lat,loss)}});
  const cpu=v('cpu'),mem=v('mem'),dsk=v('dsk');
  const res=[cpu,mem,dsk].some(x=>x!=null&&x>=80);
  const qBad=q.some(x=>x.g!=='normal'&&x.g!=='unknown')||binsFor(nd,'1h').some(row=>row.slice(-6).some(b=>b.g==='loss'||b.g==='failed'));
  const status=nd.offline?'offline':nd.stale?'stale':res?'warning':qBad?'attention':'online';
  return {cpu,mem,dsk,rx:v('rx'),tx:v('tx'),conn:v('conn'),q,status,fresh,lastSeen:fresh?0:nd.offline?Math.round((Date.now()/1000)-last(s.t.filter((_,i)=>s.cpu[i]!=null))):150};

function binsFor(nd,range,count=36){
  const s=DATA[range][nd.id],n=s.t.length,size=n/count;

      if(RANK[g]>=RANK[worst.g]||worst.lat==null)worst={g:RANK[g]>=RANK[worst.g]?g:worst.g,lat:Math.max(worst.lat??0,s.lat[c.k][i]),loss:Math.max(worst.loss??0,s.loss[c.k][i])}}
    if(missing>(z-a)*.2)worst={g:'unknown',lat:null,loss:null};
    return {...worst,t0:s.t[a],t1:s.t[z-1]+RANGES[range].step}}));
}

/* ---------- formatting ---------- */
const f1=v=>v==null?'—':v.toFixed(1);
const f0=v=>v==null?'—':Math.round(v).toString();
const rate=v=>{if(v==null)return ['—',''];if(v>=1)return [v.toFixed(v>=10?1:2),'MiB/s'];return [Math.round(v*1024).toString(),'KiB/s']};
const rateS=v=>{const [a,b]=rate(v);return a+(b?' '+b:'')};
const bytesG=v=>v>=1024?(v/1024).toFixed(2)+' TiB':v.toFixed(0)+' GiB';

/* ---------- small svg helpers ---------- */
function segs(vals,x,y){let d='',pen=false;vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1);pen=true});return d}
function areas(vals,x,y,base){let d='',run=[];const flush=()=>{if(run.length>1)d+='M'+x(run[0]).toFixed(1)+','+base+run.map(i=>'L'+x(i).toFixed(1)+','+y(vals[i]).toFixed(1)).join('')+'L'+x(run.at(-1)).toFixed(1)+','+base+'Z';run=[]};vals.forEach((v,i)=>v==null?flush():run.push(i));flush();return d}
function spark(vals,{w=120,h=22,color='--accent',max,fill=true,vals2,color2}={}){
  const all=vals.concat(vals2||[]).filter(v=>v!=null);if(!all.length)return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${h-1}" y2="${h-1}" stroke="var(--line)" stroke-dasharray="2 3"/></svg>`;

function niceMax(v){if(!(v>0))return 1;const p=10**Math.floor(Math.log10(v));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p}

/* ---------- full chart with crosshair ---------- */
const CHARTS=new Map();
function chart(el,{series,unit,h=150,max,thr,mirror=false,fmt=f0,range}){
  const w=Math.max(240,el.clientWidth||380),pad={l:36,r:6,t:8,b:20};
  const n=series[0].v.length,t=series[0].t;
  const all=series.flatMap(s=>s.v).filter(v=>v!=null);
  const top=max??niceMax(Math.max(thr??0,...all,0)*1.08);
  const ih=h-pad.t-pad.b,mid=mirror?pad.t+ih/2:null;
  const x=i=>pad.l+i*(w-pad.l-pad.r)/(n-1);
  const y=mirror?(v=>mid-(v/top)*(ih/2)):(v=>pad.t+(1-v/top)*ih);
  const y2=v=>mid+(v/top)*(ih/2);
  let g=`<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="${esc(series.map(s=>s.label).join('、'))}趋势">`;
  const ticks=mirror?[top,top/2,0,top/2,top]:[top,top*.75,top*.5,top*.25,0];
  ticks.forEach((v,i)=>{const yy=mirror?pad.t+i*ih/4:y(v);g+=`<line class="grid" x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" ${i===ticks.length-1||(mirror&&i===2)?'':'stroke-dasharray="1 3"'}/><text x="${pad.l-6}" y="${yy+3}" text-anchor="end">${fmt(v)}</text>`});
  // missing samples = shaded columns, never interpolated
  let gs=-1;for(let i=0;i<=n;i++){const miss=i<n&&series.every(s=>s.v[i]==null);if(miss&&gs<0)gs=i;if(!miss&&gs>=0){g+=`<rect class="gap" x="${x(Math.max(0,gs-.5))}" y="${pad.t}" width="${Math.max(2,x(Math.min(n-1,i-.5))-x(Math.max(0,gs-.5)))}" height="${ih}"/>`;gs=-1}}
  if(thr!=null&&thr<=top)g+=`<line class="thr" x1="${pad.l}" x2="${w-pad.r}" y1="${y(thr)}" y2="${y(thr)}"/><text x="${w-pad.r}" y="${y(thr)-4}" text-anchor="end" style="fill:var(--lightloss)">${thr} ${unit}</text>`;
  [0,Math.floor((n-1)/3),Math.floor((n-1)*2/3),n-1].forEach((i,k)=>g+=`<text x="${x(i)}" y="${h-5}" text-anchor="${k===0?'start':k===3?'end':'middle'}">${tlabel(t[i],range)}</text>`);
  series.forEach((s,si)=>{const yy=mirror&&si===1?y2:y,base=mirror?mid:pad.t+ih;
    if(s.area)g+=`<path d="${areas(s.v,x,yy,base)}" fill="${css(s.color)}" fill-opacity=".13"/>`;
    g+=`<path d="${segs(s.v,x,yy)}" fill="none" stroke="${css(s.color)}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lv=last(s.v);if(lv!=null){const li=s.v.lastIndexOf(lv);g+=`<circle cx="${x(li)}" cy="${yy(lv)}" r="2.8" fill="${css(s.color)}" stroke="var(--surface)" stroke-width="1.5"/>`}});
  g+=`<g class="xh-g" visibility="hidden"><line class="xh" y1="${pad.t}" y2="${pad.t+ih}"/>${series.map(s=>`<circle r="3.2" fill="${css(s.color)}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}</g>`;
  g+=`<rect x="${pad.l}" y="0" width="${w-pad.l-pad.r}" height="${h}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML=g+`<div class="readout"></div>`;
  const ro=el.querySelector('.readout'),xg=el.querySelector('.xh-g'),line=xg.querySelector('line'),dots=xg.querySelectorAll('circle');
  const show=i=>{
    const parts=series.map(s=>`<span><i style="display:inline-block;width:8px;height:2px;background:${css(s.color)};vertical-align:3px;margin-right:4px"></i>${s.label} <b>${s.v[i]==null?'—':fmt(s.v[i])}</b> ${s.v[i]==null?'':unit}</span>`).join('');
    ro.innerHTML=`<span class="t">${tlabel(t[i],range==='7d'?'7d':'1h')}${range==='7d'?' '+hhmm(t[i]):''}</span>${parts}`;
  };
  const lastIdx=Math.max(0,...series.map(s=>s.v.lastIndexOf(last(s.v))));
  show(lastIdx);
  el.querySelector('.hit').addEventListener('pointermove',e=>{
    const r=el.querySelector('svg').getBoundingClientRect(),px=(e.clientX-r.left)*(w/r.width);
    const i=clamp(Math.round((px-pad.l)/((w-pad.l-pad.r)/(n-1))),0,n-1);
    xg.setAttribute('visibility','visible');line.setAttribute('x1',x(i));line.setAttribute('x2',x(i));
    series.forEach((s,si)=>{const v=s.v[i];const d=dots[si];if(v==null){d.setAttribute('visibility','hidden')}else{d.setAttribute('visibility','visible');d.setAttribute('cx',x(i));d.setAttribute('cy',(mirror&&si===1?y2:y)(v))}});
    show(i);
  });
  el.querySelector('.hit').addEventListener('pointerleave',()=>{xg.setAttribute('visibility','hidden');show(lastIdx)});
}

/* ---------- views ---------- */
function rows(){
  const q=state.q.trim().toLowerCase();
  return NODES.map(nd=>({nd,cur:current(nd)})).filter(({nd,cur})=>
    (state.region==='all'||nd.region===state.region)&&
    (state.status==='all'||(state.status==='attention'?cur.status!=='online':cur.status===state.status))&&
    [nd.name,nd.city,nd.cc,nd.os,nd.role,nd.region].join(' ').toLowerCase().includes(q));
}
const minLat=cur=>{const v=cur.q.map(x=>x.lat).filter(x=>x!=null);return v.length?Math.min(...v):Infinity};
function sorted(list){
  const by={weight:(a,b)=>b.nd.w-a.nd.w,cpu:(a,b)=>(b.cur.cpu??-1)-(a.cur.cpu??-1),lat:(a,b)=>minLat(a.cur)-minLat(b.cur),net:(a,b)=>((b.cur.rx??0)+(b.cur.tx??0))-((a.cur.rx??0)+(a.cur.tx??0)),name:(a,b)=>a.nd.name.localeCompare(b.nd.name)}[state.sort];
  return list.sort(by);
}
const meter=(label,v,color)=>`<div class="mtr ${v!=null&&v>=80?'hot':''}" style="--c:${css(color)}" title="${label} ${f1(v)}%"><span class="num">${f0(v)}<small>%</small></span><span class="bar"><i style="width:${v??0}%"></i></span></div>`;
function qLines(nd,cur,bins){
  return CARRIERS.map((c,ci)=>{const q=cur.q[ci];return `<div class="q-line"><span>${c.s}</span><div class="strip" data-node="${nd.id}" data-c="${ci}">${bins[ci].map((b,bi)=>`<i class="g-${b.g}" data-b="${bi}"></i>`).join('')}</div><span class="num">${f0(q.lat)}<small>ms</small></span><span class="ls ${q.loss>=5?'bad':''}">${q.loss==null?'—':q.loss.toFixed(1)+'%'}</span></div>`}).join('');
}
function netCell(nd,cur,s){
  return `<div class="net"><span class="arr">↓</span><span class="num">${rate(cur.rx)[0]}<small>${rate(cur.rx)[1]}</small></span><span class="arr">↑</span><span class="num">${rate(cur.tx)[0]}<small>${rate(cur.tx)[1]}</small></span>${spark(s.rx,{w:120,h:16,color:'--c-rx',vals2:s.tx,color2:'--c-tx'})}</div>`;
}
function nameCell(nd,cur){
  const tag=cur.status==='offline'?'<span class="tag warn">离线</span>':cur.status==='stale'?'<span class="tag">过期</span>':'';
  return `<div class="nm"><span class="st" data-s="${cur.status}" title="${SLABEL[cur.status]}"></span><div><b>${esc(nd.name)} · ${esc(nd.city)}${tag}</b><span class="sub">${nd.cc} · ${esc(nd.os)} · ${nd.v6?'v4 / v6':'v4'}</span></div></div>`;
}

  const sum=k=>Array.from({length:n},(_,i)=>{const v=NODES.map(nd=>S[nd.id][k][i]).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0):null});

  <div class="cell"><span class="label">三网中位延迟 · 当前</span>${CARRIERS.map((c,ci)=>{const m=med(ci);return `<div class="ctr"><span>${c.name}</span><span class="bar"><i style="width:${m==null?0:Math.min(100,m/500*100)}%;background:${css(c.c)}"></i></span><span class="num">${f0(m)}<small>ms</small></span></div>`}).join('')}</div>

function renderHeat(){
  const m=state.heat,range=state.range,cols=48;
  const ns=sorted(rows().length?rows():NODES.map(nd=>({nd,cur:current(nd)}))).map(x=>x.nd);
  const val=(s,i)=>m==='cpu'?s.cpu[i]:m==='lat'?(()=>{const v=CARRIERS.map(c=>s.lat[c.k][i]).filter(v=>v!=null);return v.length?Math.min(...v):null})():(()=>{const v=CARRIERS.map(c=>s.loss[c.k][i]).filter(v=>v!=null);return v.length?Math.max(...v):null})();
  const top=m==='cpu'?100:m==='lat'?400:10,hue=m==='cpu'?'--accent':m==='lat'?'--slow':'--loss';
  const fmt=v=>v==null?'无数据':m==='cpu'?v.toFixed(1)+'%':m==='lat'?Math.round(v)+' ms':v.toFixed(1)+'%';
  let html='<div class="hm">';
  for(const nd of ns){const s=DATA[range][nd.id],n=s.t.length;
    html+=`<span class="nmc" data-id="${nd.id}">${esc(nd.name)} · ${esc(nd.city)}</span><div class="cells">`;
    for(let b=0;b<cols;b++){const a=Math.floor(b*n/cols),z=Math.max(a+1,Math.floor((b+1)*n/cols));const vs=[];for(let i=a;i<z;i++){const v=val(s,i);if(v!=null)vs.push(v)}
      const v=vs.length===z-a?(m==='cpu'?vs.reduce((x,y)=>x+y,0)/vs.length:Math.max(...vs)):null;
      const pct=v==null?0:Math.round(clamp(v/top,0,1)**.8*100);
      html+=v==null?`<i class="g-unknown" data-tip="${esc(nd.name)} · ${tlabel(s.t[a],range)} · 无数据"></i>`:`<i style="background:color-mix(in oklab,var(${hue}) ${Math.max(6,pct)}%,var(--heat-lo))" data-tip="${esc(nd.name)} · ${tlabel(s.t[a],range)}${range==='7d'?' '+hhmm(s.t[a]):''} · ${fmt(v)}"></i>`}

}

function renderEvents(){
  const range=state.range,ev=[];
  for(const nd of NODES){const s=DATA[range][nd.id],n=s.t.length;
    let prevC=null,prevOn=true;
    for(let i=1;i<n;i++){
      const on=s.cpu[i]!=null;
      if(prevOn&&!on&&s.cpu[i-1]!=null){const gap=GAP[range]&&i>=GAP[range][0]&&i<=GAP[range][1];if(!gap)ev.push({t:s.t[i],nd,k:'fail',txt:nd.stale?'心跳停止更新':'离线 · 心跳中断'})}
      prevOn=on;
      if(s.cpu[i]!=null&&s.cpu[i]>=80&&s.cpu[i-1]!=null&&s.cpu[i-1]<80&&(prevC==null||i-prevC>6)){ev.push({t:s.t[i],nd,k:'lightloss',txt:`CPU 升至 ${s.cpu[i].toFixed(0)}%`});prevC=i}
      CARRIERS.forEach(c=>{const g=grade(s.lat[c.k][i],s.loss[c.k][i]),gp=grade(s.lat[c.k][i-1],s.loss[c.k][i-1]);
        if((g==='loss'||g==='failed')&&gp!=='loss'&&gp!=='failed'&&gp!=='unknown')ev.push({t:s.t[i],nd,k:g==='failed'?'fail':'loss',txt:`${c.name} ${g==='failed'?'探测全部失败':'失败率 '+s.loss[c.k][i].toFixed(1)+'%'}`})});
    }}
  if(GAP[range])ev.push({t:DATA[range][NODES[0].id].t[GAP[range][0]],nd:null,k:'unknown',txt:`采集缺口 ${GAP[range][1]-GAP[range][0]+1} 桶 · 全部节点留空`});
  ev.sort((a,b)=>b.t-a.t);
  const color={fail:'--fail',loss:'--loss',lightloss:'--lightloss',unknown:'--muted'};
  $('#evCount').textContent=`${range} 内 ${ev.length} 条 · 由历史推导`;
  $('#events').innerHTML=ev.slice(0,40).map(e=>`<li><time>${range==='7d'?tlabel(e.t,'7d'):hhmm(e.t)}</time><span class="dot" style="background:${css(color[e.k])}"></span><span>${e.nd?`<b data-id="${e.nd.id}" style="cursor:pointer">${esc(e.nd.name)}</b> `:''}<span class="why">${esc(e.txt)}</span></span></li>`).join('')||'<li><span></span><span></span><span class="why">窗口内没有状态变化。</span></li>';
}

function renderControls(){
  const counts=r=>NODES.filter(n=>r==='all'||n.region===r).length;
  $('#regions').innerHTML=[['all','全部'],...REGIONS.map(r=>[r,r])].map(([k,l])=>`<button class="pill" data-r="${k}" aria-pressed="${state.region===k}">${l} <b>${counts(k)}</b></button>`).join('');
  const cur=NODES.map(current),att=cur.filter(c=>c.status!=='online').length;
  $('#statuses').innerHTML=[['all','全部',null],['attention','留意','--lightloss'],['offline','离线','--fail']].map(([k,l,c])=>`<button class="pill" data-s="${k}" aria-pressed="${state.status===k}">${c?`<i class="sw" style="background:${css(c)}"></i>`:''}${l}${k==='attention'?` <b>${att}</b>`:k==='offline'?` <b>${cur.filter(c=>c.status==='offline').length}</b>`:''}</button>`).join('');
  document.querySelectorAll('[data-range]').forEach(g=>g.innerHTML=Object.keys(RANGES).map(r=>`<button data-rg="${r}" aria-pressed="${state.range===r}">${r}</button>`).join(''));
  document.querySelectorAll('#view button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.view));
  document.querySelectorAll('#heatm button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===state.heat));
  $('#sort').value=state.sort;
}
function renderAll(){
  const focusId=document.activeElement?.closest?.('[data-id]')?.dataset.id;
  renderControls();renderBand();renderMatrix();renderInspector();renderHeat();renderEvents();
  $('#hCount').textContent=NODES.length;
  $('#updated').textContent=hms(Date.now()/1000);
  if(focusId)document.querySelector(`#mx [data-id="${focusId}"]`)?.focus({preventScroll:true});
}

/* ---------- interaction ---------- */
const mq=matchMedia('(max-width:1100px)');
function select(id){state.sel=id;document.querySelectorAll('#mx [data-id]').forEach(r=>r.setAttribute('aria-selected',r.dataset.id===id));renderInspector();if(mq.matches){document.body.classList.add('sheet');$('#insp').focus()}}
function closeSheet(){document.body.classList.remove('sheet');document.querySelector(`#mx [data-id="${state.sel}"]`)?.focus()}
document.addEventListener('click',e=>{
  const rg=e.target.closest('[data-rg]');if(rg){state.range=rg.dataset.rg;renderAll();return}
  const r=e.target.closest('[data-r]');if(r){state.region=r.dataset.r;renderControls();renderMatrix();renderHeat();return}
  const s=e.target.closest('#statuses [data-s]');if(s){state.status=s.dataset.s;renderControls();renderMatrix();renderHeat();return}
  const v=e.target.closest('#view [data-v]');if(v){state.view=v.dataset.v;try{localStorage.setItem('sg6-view',state.view)}catch{};renderControls();renderMatrix();return}
  const hm=e.target.closest('#heatm [data-m]');if(hm){state.heat=hm.dataset.m;renderControls();renderHeat();return}
  const id=e.target.closest('#mx [data-id],#heat [data-id],#events [data-id]');if(id){select(id.dataset.id);return}
});
$('#scrim').onclick=closeSheet;
$('#sort').onchange=e=>{state.sort=e.target.value;renderMatrix();renderHeat()};
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderMatrix();renderHeat()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus();return}
  if(e.key==='Escape'){if(document.body.classList.contains('sheet'))closeSheet();else if(document.activeElement===$('#q')){$('#q').value='';state.q='';renderMatrix();renderHeat()}return}
  const row=e.target.closest?.('#mx [data-id]');if(!row)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();select(row.dataset.id);return}
  if(['ArrowDown','ArrowUp','j','k'].includes(e.key)){e.preventDefault();const all=[...document.querySelectorAll('#mx [data-id]')],i=all.indexOf(row),nx=all[clamp(i+(e.key==='ArrowDown'||e.key==='j'?1:-1),0,all.length-1)];nx.focus();select(nx.dataset.id)}
});
$('#theme').onclick=()=>{const root=document.documentElement,dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('sg6-theme',root.dataset.theme)}catch{};renderInspector()};

/* tooltip for strips, heat cells, dots */
const tip=$('#tip');
function tipFor(el){
  if(el.dataset.tip)return esc(el.dataset.tip);
  const strip=el.parentElement;if(!strip?.dataset.node)return null;
  const nd=NODES.find(n=>n.id===strip.dataset.node),c=CARRIERS[+strip.dataset.c],count=+(strip.dataset.n||(state.view==='cards'&&strip.closest('.card')?30:36));
  const b=binsFor(nd,state.range,count)[+strip.dataset.c][+el.dataset.b];
  const fmtT=t=>state.range==='7d'?tlabel(t,'7d')+' '+hhmm(t):hhmm(t);
  return `<b>${esc(nd.name)} · ${c.name}</b><br>${fmtT(b.t0)} – ${fmtT(b.t1)}<br>${GLABEL[b.g]}${b.lat!=null?` · 最高 ${b.lat} ms · 失败 ${b.loss.toFixed(1)}%`:''}`;
}
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip],.strip i');if(!el){tip.hidden=true;return}const h=tipFor(el);if(!h){tip.hidden=true;return}tip.innerHTML=h;tip.hidden=false});
document.addEventListener('pointermove',e=>{if(tip.hidden)return;const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=clamp(e.clientX+12,8,innerWidth-w-8)+'px';tip.style.top=(e.clientY+16+h>innerHeight?e.clientY-h-10:e.clientY+16)+'px'});
document.addEventListener('pointerleave',()=>tip.hidden=true);

/* ---------- live tick: append one sample per 5 s to 1h ---------- */
function tick(){
  const now=Math.floor(Date.now()/1000);
  for(const nd of NODES){if(nd.offline||nd.stale)continue;const s=DATA['1h'][nd.id],r=rng(hash(nd.id)+now);
    const push=(arr,v)=>{arr.push(v);arr.shift()};
    s.t.push(now);s.t.shift();
    push(s.cpu,clamp(last(s.cpu)+(nd.cpu*(nd.ramp?1.35:1)-last(s.cpu))*.2+(r()-.5)*7,1,99));
    push(s.mem,clamp(last(s.mem)+(r()-.5)*.8,5,99));push(s.dsk,last(s.dsk));
    push(s.rx,Math.max(0,last(s.rx)+(nd.rx-last(s.rx))*.3+(r()-.5)*nd.rx*.5));push(s.tx,Math.max(0,last(s.tx)+(nd.tx-last(s.tx))*.3+(r()-.5)*nd.tx*.5));
    push(s.conn,Math.max(1,Math.round(last(s.conn)+(r()-.5)*6)));
    CARRIERS.forEach((c,ci)=>{const base=nd.lat[ci];push(s.lat[c.k],Math.round(base+(r()-.5)*base*.12+(r()<.03?120:0)));push(s.loss[c.k],nd.lossy===c.k&&r()<.12?+(2+r()*5).toFixed(1):0)});
  }
  for(const nd of NODES){if(nd.offline||nd.stale){const s=DATA['1h'][nd.id];s.t.push(now);s.t.shift();for(const k of ['cpu','mem','dsk','rx','tx','conn']){s[k].push(null);s[k].shift()}CARRIERS.forEach(c=>{s.lat[c.k].push(null);s.lat[c.k].shift();s.loss[c.k].push(null);s.loss[c.k].shift()})}}
  if(state.range==='1h'){renderBand();if(!document.querySelector('#mx :hover'))renderMatrix();if(!$('#insp').matches(':hover'))renderInspector();renderHeat()}
  else{renderBand()}
  $('#updated').textContent=hms(now);
  const ring=$('#ring');ring.style.animation='none';ring.getBoundingClientRect();ring.style.animation='';
}
setInterval(()=>$('#clock').textContent=hms(Date.now()/1000),1000);
$('#clock').textContent=hms(Date.now()/1000);
setInterval(tick,5000);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderInspector,120)});
mq.addEventListener('change',()=>document.body.classList.remove('sheet'));
renderAll();
})();
</script>
