function resource(s,key){return samples.map(a=>{let r=a.servers.find(x=>x.name===s.name);return {t:a.updated,v:!r?null:key==='memory'?pct(r.memory_used,r.memory_total):key==='disk'?pct(r.hdd_used,r.hdd_total):r.cpu}})}
function chart(lines,{max=null,unit='',large=false}={}){let w=large?440:320,h=large?170:65,l=large?38:28,r=8,top=12,bottom=h-16,vals=lines.flatMap(x=>x.points.map(p=>p.v).filter(v=>v!=null));max=max??Math.max(1,...vals)*1.15;let x=t=>l+(t-first.updated)/(last.updated-first.updated)*(w-l-r),y=v=>bottom-v/max*(bottom-top);let paths=lines.map(line=>{let d='',pen=false;for(let p of line.points){if(p.v==null){pen=false;continue}d+=(pen?'L':'M')+x(p.t).toFixed(2)+','+y(p.v).toFixed(2);pen=true}return `<path class="sg-trend" stroke="${line.color||'var(--green)'}" d="${d}"/>`}).join('');return `<svg class="sg-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${lines.map(x=>x.label).join('、')}，${clock(first.updated)} 至 ${clock(last.updated)}，单位 ${unit}"><path class="sg-grid" fill="none" d="M${l} ${top}H${w-r}M${l} ${(top+bottom)/2}H${w-r}M${l} ${bottom}H${w-r}"/><text x="0" y="${top+3}">${max>=1000?number(max/1000,1)+'k':number(max,max<10?1:0)}</text><text x="0" y="${bottom}">0</text>${paths}<text x="${l}" y="${h-1}">${clock(first.updated)}</text><text x="${w-r}" y="${h-1}" text-anchor="end">${clock(last.updated)}</text></svg>`}

function summary(){let online=rows.filter(s=>s.online4||s.online6).length,attention=rows.filter(s=>s.attention).length,cpu=rows.reduce((n,s)=>n+s.cpu,0)/rows.length,up=rows.reduce((n,s)=>n+s.network_tx,0),down=rows.reduce((n,s)=>n+s.network_rx,0);let total=k=>samples.map(a=>({t:a.updated,v:a.servers.reduce((v,s)=>v+(s[k]||0),0)/1024}));$('#summary').innerHTML=`<div><span class="sg-label">在线节点</span><div class="sg-big">${online}<small> / ${rows.length}</small></div><span class="sg-label">IPv4 / IPv6</span></div><div><span class="sg-label">需要留意</span><div class="sg-big" style="color:var(--amber)">${attention}<small> 个节点</small></div><span class="sg-label"></span></div><div><span class="sg-label">平均 CPU</span><div class="sg-big">${number(cpu)}<small> %</small></div><span class="sg-label"></span></div><div><span class="sg-label">即时吞吐</span><div class="sg-big">↓ ${rate(down)}</div><span class="sg-label">↑ ${rate(up)}</span></div>`}

const qualityLabels={normal:'正常',slow:'高延迟',lightloss:'轻丢包',loss:'明显丢包 / 超时风险',failed:'探测失败',unknown:'无有效数据'};
function gradeAt(record,name,key){const s=record.servers.find(x=>x.name===name);if(!s||(!s.online4&&!s.online6)||typeof s.latest_ts!=='number'||record.updated-s.latest_ts>60)return {grade:'unknown',latency:null,loss:null,reason:'节点离线或心跳过期，线路状态未知'};const latency=s['time_'+key],loss=s['ping_'+key];if(typeof latency!=='number'||!Number.isFinite(latency)||latency<=0||typeof loss!=='number'||!Number.isFinite(loss)||loss<0||loss>100)return {grade:'unknown',latency:null,loss:null,reason:'字段缺失或探测尚未初始化'};if(loss===100)return {grade:'failed',latency,loss,reason:'滚动探测失败率 100%，不等同于节点离线'};if(latency>=1000)return {grade:'loss',latency,loss,reason:'延迟触及 1000ms 超时设置，标记超时风险，不断言全部失败'};if(loss>=5)return {grade:'loss',latency,loss,reason:'滚动失败率 ≥5%'};if(loss>0)return {grade:'lightloss',latency,loss,reason:'滚动失败率 >0% 且 <5%'};if(latency>=300)return {grade:'slow',latency,loss,reason:'本页视觉分档 ≥300ms；跨境线路需结合地域判断'};return {grade:'normal',latency,loss,reason:'延迟 <300ms 且滚动失败率为 0%'};}
function beatText(record,s,key){const q=gradeAt(record,s.name,key);return `${clock(record.updated)} CST · ${qualityLabels[q.grade]} · ${q.latency==null?'—':q.latency+' ms'} · 滚动失败率 ${q.loss==null?'—':number(q.loss)+'%'}`;}
function escapeAttr(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
rows.forEach(s=>{const priority={normal:0,slow:1,lightloss:2,loss:3,failed:4,unknown:5};const worst=carriers.map(c=>gradeAt(last,s.name,c[1])).sort((a,b)=>priority[b.grade]-priority[a.grade])[0];const resourceWarning=[s.cpu,s.mem,s.disk].some(v=>v>=80);s.attention=resourceWarning||worst.grade!=='normal';s.qualityText=resourceWarning?'资源偏高':{normal:'正常',slow:'高延迟',lightloss:'轻丢包',loss:'需留意',failed:'探测失败',unknown:'无数据'}[worst.grade]});
function uptimeRows(s){return carriers.map(([label,key])=>`<div class="sg-uptime-row"><div class="sg-uptime-heading"><b>${label}</b><span><strong>${s['time_'+key]} ms</strong>失败 ${number(s['ping_'+key])}%</span></div><div class="sg-beats" role="group" aria-label="${label}时间序列，左旧右新">${samples.map((record,i)=>{const q=gradeAt(record,s.name,key);const duration=i<samples.length-1?samples[i+1].updated-record.updated:Math.max(1,record.updated-samples[i-1].updated);const text=beatText(record,s,key);return `<button class="sg-beat" style="flex:${duration}" tabindex="${i===samples.length-1?0:-1}" data-grade="${q.grade}" data-sample="${i}" data-node="${s.id}" data-carrier="${key}" title="${escapeAttr(text)}" aria-label="${escapeAttr(label+' '+text)}"></button>`}).join('')}</div></div>`).join('');}
function card(s){return `<article class="sg-card" data-id="${s.id}"><div class="sg-top">${pod.replace('<svg','<svg class="sg-pod"')}<h3>${s.name}</h3><span class="sg-status ${s.attention?'sg-warn':''}">${s.qualityText}</span></div><p class="sg-meta">${s.region} · ${s.labels.replace('os=','')} · ${s.online4?'IPv4':''} / ${s.online6?'IPv6':''}</p><div class="sg-resources">${[['CPU',s.cpu],['内存',s.mem],['磁盘',s.disk]].map(([k,v])=>`<div><span class="sg-label">${k}</span><strong>${number(v)}<small> %</small></strong><div class="sg-meter"><i style="width:${v??0}%;${v>=80?'background:var(--amber)':''}"></i></div></div>`).join('')}</div><div class="sg-speedline"><span>↓ 接收 <strong>${rate(s.network_rx)}</strong></span><span>↑ 发送 <strong>${rate(s.network_tx)}</strong></span></div><div class="sg-quality"><div class="sg-quality-title"><span>三网</span><span>近 93 秒</span></div>${uptimeRows(s)}<div class="sg-uptime-axis"><span>${clock(first.updated)}</span><span>93 秒</span><span>${clock(last.updated)}</span></div><div class="sg-beat-readout" aria-live="polite"></div></div><div class="sg-foot"><span>累计 ↓ <strong>${bytes(s.network_in)}</strong> ↑ <strong>${bytes(s.network_out)}</strong></span><span><strong>${s.tcp_count+s.udp_count}</strong> 连接</span></div><details class="sg-extra"><summary>系统与原始指标</summary><p>运行 ${s.uptime} · 负载 ${s.load_1} / ${s.load_5} / ${s.load_15}<br>内存 ${number(s.memory_used/1024)} / ${number(s.memory_total/1024)} MiB<br>磁盘 ${number(s.hdd_used/1024)} / ${number(s.hdd_total/1024)} GiB<br>TCP ${s.tcp_count} · UDP ${s.udp_count} · 进程 ${s.process_count}<br></p></details><button class="sg-detail-btn" data-open="${s.id}" aria-label="查看 ${s.name} 历史详情">历史详情 ↗</button></article>`}
function render(){let q=$('#search').value.toLowerCase(),region=$('#region').value,status=$('#status').value;let shown=rows.filter(s=>(s.name+' '+s.region+' '+s.location).toLowerCase().includes(q)&&(region==='all'||s.location===region)&&(status==='all'||(status==='attention'?s.attention:!s.attention)));$('#count').textContent=`${shown.length} / ${rows.length} 个节点`;$('#cards').innerHTML=shown.length?shown.map(card).join(''):`<div class="sg-empty"><p>没有匹配的节点。</p><button class="sg-reset" id="reset">重置筛选</button></div>`}
let selected=null,range='1h',tab='quality',opener=null;let historyMetric='latency',historyLines=[];const dialog=$('#detail');

function hxSeries(){const colors=['var(--hx-teal)','var(--hx-blue)','var(--hx-purple)'];if(tab==='quality')return carriers.map(([name,key],i)=>({name,color:colors[i],unit:historyMetric==='loss'?'%':'ms',points:series(selected,(historyMetric==='loss'?'ping_':'time_')+key)}));if(tab==='network')return [{name:'接收',color:colors[0],unit:'KiB/s',points:net(selected,'network_rx')},{name:'发送',color:colors[1],unit:'KiB/s',points:net(selected,'network_tx')}];return [{name:{cpu:'CPU',memory:'内存',disk:'磁盘'}[historyMetric],color:colors[{cpu:0,memory:1,disk:2}[historyMetric]],unit:'%',points:resource(selected,historyMetric)}];}
function hxTick(v){return v>=1000?number(v/1000,1)+'k':Number(v.toFixed(1)).toString()}
function hxWidth(){return innerWidth<=700?Math.max(250,innerWidth*.96-58):Math.min(960,innerWidth*.94-104)}
function hxGraph(lines){const w=hxWidth(),h=innerWidth<=700?230:280,left=44,right=16,top=16,bottom=h-34;const values=lines.flatMap(l=>l.points.filter(p=>p.v!==null&&Number.isFinite(p.v)).map(p=>p.v));let cap=tab==='resource'?100:Math.max(1,...values)*1.15;if(tab!=='resource'){const power=10**Math.floor(Math.log10(cap));cap=Math.ceil(cap/power/0.5)*power*.5}const x=t=>left+(t-first.updated)/(last.updated-first.updated)*(w-left-right),y=v=>bottom-v/cap*(bottom-top);let grid='',ticks='';for(let i=0;i<=4;i++){const v=cap*i/4,yy=y(v);grid+=`<path class="hx-grid" d="M${left} ${yy}H${w-right}"/>`;ticks+=`<text x="${left-9}" y="${yy+4}" text-anchor="end">${hxTick(v)}</text>`}const steps=w<500?2:4;for(let i=0;i<=steps;i++){const t=first.updated+(last.updated-first.updated)*i/steps;ticks+=`<text x="${x(t)}" y="${h-10}" text-anchor="${i===0?'start':i===steps?'end':'middle'}">${clock(t)}</text>`}const paths=lines.map((l,i)=>{let d='',area='',pen=false;for(let p of l.points){if(p.v===null){pen=false;continue}d+=(pen?'L':'M')+x(p.t).toFixed(2)+','+y(p.v).toFixed(2);pen=true}if(lines.length===1&&l.points.every(p=>p.v!==null))area=`<path d="${d}L${x(last.updated)} ${bottom}L${x(first.updated)} ${bottom}Z" fill="url(#hx-fill)"/>`;return area+`<path class="hx-line" d="${d}" stroke="${l.color}"/>`}).join('');return `<div class="hx-chart" id="hx-chart" tabindex="0" role="group" aria-label="历史图，可用左右方向键查看样本"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${lines.map(l=>l.name).join('、')}历史，单位${lines[0].unit}"><defs><linearGradient id="hx-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lines[0].color}" stop-opacity=".15"/><stop offset="1" stop-color="${lines[0].color}" stop-opacity="0"/></linearGradient></defs>${grid}${ticks}${paths}<line id="hx-cursor" class="hx-crosshair" x1="${x(last.updated)}" x2="${x(last.updated)}" y1="${top}" y2="${bottom}"/>${lines.map((l,i)=>`<circle data-hx-dot="${i}" cx="${x(last.updated)}" cy="${y(l.points.at(-1).v??0)}" r="4" fill="${l.color}" stroke="var(--paper)" stroke-width="2"/>`).join('')}</svg></div>`;}
let hxIndex=samples.length-1;
function hxInspect(index){hxIndex=Math.max(0,Math.min(samples.length-1,index));const t=samples[hxIndex].updated;$('#hx-readout').innerHTML=`<span>${clock(t)}</span>`+historyLines.map(l=>`<span><i style="background:${l.color}"></i>${l.name} <b>${number(l.points[hxIndex]?.v)} ${l.unit}</b></span>`).join('');const svg=$('#hx-chart svg');if(!svg)return;const w=hxWidth(),h=innerWidth<=700?230:280,left=44,right=16,top=16,bottom=h-34;const values=historyLines.flatMap(l=>l.points.filter(p=>p.v!==null&&Number.isFinite(p.v)).map(p=>p.v));let cap=tab==='resource'?100:Math.max(1,...values)*1.15;if(tab!=='resource'){const power=10**Math.floor(Math.log10(cap));cap=Math.ceil(cap/power/.5)*power*.5}const xx=left+(t-first.updated)/(last.updated-first.updated)*(w-left-right);$('#hx-cursor').setAttribute('x1',xx);$('#hx-cursor').setAttribute('x2',xx);historyLines.forEach((l,i)=>{const dot=svg.querySelector(`[data-hx-dot="${i}"]`),v=l.points[hxIndex]?.v;dot.style.display=v===null?'none':'';dot.setAttribute('cx',xx);dot.setAttribute('cy',bottom-(v??0)/cap*(bottom-top))});}
function large(){const options=tab==='quality'?[['latency','延迟'],['loss','失败率']]:tab==='resource'?[['cpu','CPU'],['memory','内存'],['disk','磁盘']]:[];if(options.length&&!options.some(o=>o[0]===historyMetric))historyMetric=options[0][0];$('#coverage').textContent=`${range} 窗口 · 仅有 93 秒样本`;$('#hx-metric-buttons').innerHTML=options.length?`<div class="hx-metrics">${options.map(([key,name])=>`<button data-hx-metric="${key}" class="${historyMetric===key?'active':''}">${name}</button>`).join('')}</div>`:'<span class="sg-label">双向流量 · KiB/s</span>';historyLines=hxSeries();$('#large').innerHTML=hxGraph(historyLines);$('#hx-stats').innerHTML=historyLines.map(l=>{const good=l.points.filter(p=>p.v!==null),vals=good.map(p=>p.v),max=vals.length?Math.max(...vals):null,avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;return `<div class="hx-stat"><div class="hx-stat-top"><i style="background:${l.color}"></i>${l.name}</div><strong>${number(l.points.at(-1).v)}<small>${l.unit}</small></strong><div class="hx-stat-bottom">均值 ${number(avg)} · 峰值 ${number(max)}</div></div>`}).join('');$('#hx-stats').style.gridTemplateColumns=`repeat(${historyLines.length},minmax(0,1fr))`;hxInspect(samples.length-1);$$('[data-hx-metric]').forEach(b=>b.onclick=()=>{historyMetric=b.dataset.hxMetric;large()});const plot=$('#hx-chart');plot.onpointermove=e=>{const r=plot.getBoundingClientRect();const fraction=Math.max(0,Math.min(1,((e.clientX-r.left)/r.width*hxWidth()-44)/(hxWidth()-44-16)));const time=first.updated+fraction*(last.updated-first.updated);let nearest=0;samples.forEach((p,i)=>{if(Math.abs(p.updated-time)<Math.abs(samples[nearest].updated-time))nearest=i});hxInspect(nearest)};plot.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();hxInspect(e.key==='Home'?0:e.key==='End'?samples.length-1:hxIndex+(e.key==='ArrowRight'?1:-1))}};}
function open(id,button){selected=rows.find(s=>s.id===Number(id));opener=button;$('#detail-title').textContent=selected.name;$('#detail-meta').textContent=selected.region+' · '+date(first.updated)+' '+clock(first.updated)+'—'+clock(last.updated)+' CST';large();dialog.classList.toggle('dark',$('#site').classList.contains('dark'));dialog.showModal();$('#site').inert=true;document.body.style.overflow='hidden';$('#close').focus()}
function close(){dialog.close();$('#site').inert=false;document.body.style.overflow='';opener?.focus()}
$('#cards').addEventListener('click',e=>{let beat=e.target.closest('.sg-beat');if(beat){const s=rows.find(s=>s.id===Number(beat.dataset.node));beat.closest('.sg-card').querySelector('.sg-beat-readout').classList.add('visible');beat.closest('.sg-card').querySelector('.sg-beat-readout').textContent=beatText(samples[Number(beat.dataset.sample)],s,beat.dataset.carrier);return;}let b=e.target.closest('[data-open]');if(b)open(b.dataset.open,b);else if(e.target.closest('.sg-card')&&!e.target.closest('details')){let c=e.target.closest('.sg-card'),button=c.querySelector('[data-open]');open(c.dataset.id,button)}if(e.target.closest('#reset')){$('#search').value='';$('#region').value='all';$('#status').value='all';render()}});$('#close').onclick=close;dialog.addEventListener('cancel',e=>{e.preventDefault();close()});dialog.addEventListener('click',e=>{if(e.target===dialog){let b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)close()}});dialog.addEventListener('keydown',e=>{if(e.key==='Tab'){let f=[...dialog.querySelectorAll('button,[tabindex="0"]')].filter(x=>x.getClientRects().length),i=f.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}});
$$('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;$$('[data-range]').forEach(x=>x.setAttribute('aria-pressed',x===b));large()});$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b));large()});
function showBeat(e){const beat=e.target.closest('.sg-beat');if(!beat)return;const s=rows.find(s=>s.id===Number(beat.dataset.node));beat.closest('.sg-card').querySelector('.sg-beat-readout').classList.add('visible');beat.closest('.sg-card').querySelector('.sg-beat-readout').textContent=beatText(samples[Number(beat.dataset.sample)],s,beat.dataset.carrier)}$('#cards').addEventListener('pointerover',showBeat);$('#cards').addEventListener('focusin',showBeat);$('#cards').addEventListener('pointerout',e=>{const beat=e.target.closest('.sg-beat');if(beat&&!e.relatedTarget?.closest('.sg-beats'))beat.closest('.sg-card').querySelector('.sg-beat-readout').classList.remove('visible')});$('#cards').addEventListener('focusout',e=>{const beat=e.target.closest('.sg-beat');if(beat)beat.closest('.sg-card').querySelector('.sg-beat-readout').classList.remove('visible')});$('#cards').addEventListener('keydown',e=>{const beat=e.target.closest('.sg-beat');if(!beat||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const cells=[...beat.parentElement.children],i=cells.indexOf(beat),n=e.key==='Home'?0:e.key==='End'?cells.length-1:Math.max(0,Math.min(cells.length-1,i+(e.key==='ArrowRight'?1:-1)));cells.forEach(b=>b.tabIndex=-1);cells[n].tabIndex=0;cells[n].focus()});
window.addEventListener('resize',()=>{if(dialog.open)large()});function theme(dark){$('#site').classList.toggle('dark',dark);dialog.classList.toggle('dark',dark);$('#theme').setAttribute('aria-pressed',dark);document.documentElement.style.background=dark?'#151515':'#f4f3ef';try{localStorage.setItem('garden-v5-theme',dark?'dark':'light')}catch{}}
$('#theme').onclick=()=>theme(!$('#site').classList.contains('dark'));try{theme(localStorage.getItem('garden-v5-theme')==='dark')}catch{};$('#hero-info').textContent=`ServerStatus 样本 · ${date(last.updated)} ${clock(last.updated)} CST
短时样本预览 · 93 秒`;$('#hero-info').style.whiteSpace='pre-line';[...new Set(rows.map(s=>s.location))].forEach(r=>$('#region').insertAdjacentHTML('beforeend',`<option value="${r}">${regions[r]||r}</option>`));['search','region','status'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));summary();render();
</script></html>
